name: Build and release macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test
      - run: corepack pnpm pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged app inside DMG
        shell: bash
        run: bash scripts/verify-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: project-investment-manager-mac-arm64
          path: release/Project-Investment-Manager-mac-arm64.dmg
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            'release/Project-Investment-Manager-mac-arm64.dmg' \
            --verify-tag \
            --title "项目投资资料管理工具 ${GITHUB_REF_NAME}" \
            --notes 'Apple Silicon (M1/M2/M3) 内部测试包，采用 ad-hoc 签名。未做 Apple Developer ID 签名与公证，下载后 Gatekeeper 仍可能阻止首次打开。'
